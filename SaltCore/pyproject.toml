[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saltcore"
version = "0.1.0"
description = "salt-data 的读取核心：把派生数据下的 parquet 用 DuckDB 变成结构化行情"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.5,<2",
  "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
