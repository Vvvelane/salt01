[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saltlab-factorlab"
version = "0.2.0"
description = "Auditable futures factor research over published salt-data"
requires-python = ">=3.12,<3.13"
dependencies = ["saltcore", "salt-nacl-registry"]

[tool.setuptools.packages.find]
where = ["src"]
