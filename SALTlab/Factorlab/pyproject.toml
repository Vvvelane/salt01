[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saltlab-factorlab"
version = "0.4.0"
description = "Auditable futures factor research over published salt-data"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "pandas>=2.2", "saltcore"]

[project.scripts]
factorlab = "infra.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["infra*", "ftr001*", "frv001*", "fid004*", "fcm001*"]
namespaces = true
