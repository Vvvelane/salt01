[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vollab"
version = "0.1.0"
description = "从 1min 行情评估品种对技术指标研究的可用性，并排名"
requires-python = ">=3.12,<3.13"
dependencies = [
  "saltcore",
  "duckdb>=1.5,<2",
  "pandas>=2.2",
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
