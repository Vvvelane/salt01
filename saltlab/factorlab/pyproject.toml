[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saltlab-factorlab"
version = "0.1.0"
description = "Reproducible futures factor research and normalized historical simulation"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[tool.setuptools]
packages = ["saltlab.factorlab"]

[tool.setuptools.package-dir]
"saltlab.factorlab" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
