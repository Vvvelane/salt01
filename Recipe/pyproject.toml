[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe"
version = "0.1.0"
description = "Local browser for SALT market data and NaCl cards"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pandas>=2.2",
  "saltcore",
  "uvicorn>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
