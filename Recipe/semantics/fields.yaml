# Human-readable semantic defaults. Raw supplier names remain authoritative.
fields:
  datetime:
    display_name: Timestamp
    status: confirmed
    note: Raw timestamp; timezone, session, trading_date and bar boundary remain pending.
  open:
    display_name: Bar open price
    status: confirmed
  high:
    display_name: Bar high price
    status: confirmed
  low:
    display_name: Bar low price
    status: confirmed
  close:
    display_name: Bar close price
    status: confirmed
  volume:
    display_name: Reported volume
    status: confirmed
    note: Not order-book depth.
  amount:
    display_name: Reported amount
    status: pending
  money:
    display_name: Reported money
    status: pending
  position:
    display_name: Reported position
    status: pending
    note: Not automatically renamed to open_interest.
  open_interest:
    display_name: Reported open interest
    status: confirmed
  symbol:
    display_name: Contract symbol
    status: pending

