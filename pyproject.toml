[project]
name = "salt01-workspace"
version = "0.1.0"
description = "NaCl contracts, research packages, and the Recipe browser"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "hypothesis>=6.115",
  "httpx>=0.28",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]
research = [
  "duckdb>=1.5,<2",
  "pyarrow>=25,<26",
  "scikit-learn>=1.9,<2",
  "scipy>=1.17,<2",
  "statsmodels>=0.14.6,<0.15",
]
notebook = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.6,<5",
  "matplotlib>=3.10,<4",
  "seaborn>=0.13,<0.14",
]

[tool.uv]
package = false
default-groups = ["dev", "research", "notebook"]

[tool.uv.workspace]
members = ["saltlab/factorlab", "recipe"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
  "recipe/tests",
]
