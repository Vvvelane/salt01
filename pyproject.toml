[project]
name = "salt01-workspace"
version = "0.1.0"
description = "NaCl contracts, research packages, and the Recipe browser"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "hypothesis>=6.115",
  "httpx>=0.28",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["NaCl", "saltlab/factorlab", "recipe"]
