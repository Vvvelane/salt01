[project]
name = "salt01-workspace"
version = "0.1.0"
description = "SALT shared data core and local research terminal"
requires-python = ">=3.12,<3.13"
dependencies = ["recipe", "saltlab-factorlab"]

[dependency-groups]
dev = [
  "ipykernel>=7.3.0",
  "matplotlib>=3.11.2",
  "ruff>=0.8",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["SaltCore", "Recipe", "SALTlab/Factorlab"]

[tool.uv.sources]
saltcore = { workspace = true }
recipe = { workspace = true }
saltlab-factorlab = { workspace = true }
